name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish a GitHub Release when a v* tag is pushed

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet test tests/StepCapture.Core.Tests -c Release

      - name: Publish standalone exe (no .NET install needed)
        run: >
          dotnet publish src/StepCapture.App -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish/standalone

      - name: Publish small exe (needs .NET 8 Desktop Runtime)
        run: >
          dotnet publish src/StepCapture.App -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none
          -o publish/small

      - name: Publish app folder for the installer
        run: >
          dotnet publish src/StepCapture.App -c Release -r win-x64 --self-contained true
          -p:DebugType=none -o publish/installer

      - name: Work out version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart('v') }
          else { $v = "0.1.${{ github.run_number }}" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" installer\StepCapture.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: StepCapture-Setup
          path: artifacts/StepCapture-Setup-*.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/standalone/StepCapture.exe -DestinationPath artifacts/StepCapture-win-x64.zip
          Compress-Archive -Path publish/small/StepCapture.exe -DestinationPath artifacts/StepCapture-win-x64-needs-dotnet8.zip
          Get-ChildItem artifacts, publish/standalone, publish/small | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: StepCapture-win-x64
          path: publish/standalone/StepCapture.exe

      - uses: actions/upload-artifact@v4
        with:
          name: StepCapture-win-x64-needs-dotnet8
          path: publish/small/StepCapture.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/StepCapture-Setup-*.exe
            artifacts/*.zip
          generate_release_notes: true
